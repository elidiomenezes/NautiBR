name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline map and GeoTIFF libraries
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/vendor
          curl -fL --retry 3 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' -o app/src/main/assets/vendor/leaflet.css
          curl -fL --retry 3 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' -o app/src/main/assets/vendor/leaflet.js
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js' -o app/src/main/assets/vendor/geotiff.js
          test "$(wc -c < app/src/main/assets/vendor/geotiff.js)" -gt 100000
      - name: Download GDAL Android native bindings
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 'https://github.com/kikitte/GDAL4Android/releases/download/v3.7.0-iconv/gdal-3.7.0.aar' -o app/libs/gdal-3.7.0.aar
          test "$(wc -c < app/libs/gdal-3.7.0.aar)" -gt 10000000
          unzip -t app/libs/gdal-3.7.0.aar >/dev/null
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NautiBR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
