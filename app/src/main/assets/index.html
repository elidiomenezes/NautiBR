<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101c2a;color:#eee;font:16px sans-serif;padding:12px}button,input{background:#284257;color:white;border:1px solid #64819a;border-radius:7px;padding:12px;margin:4px}input{width:85%}#results{max-height:38vh;overflow:auto}.item{padding:8px;border-bottom:1px solid #456}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>NautiBR 0.1</h2><p>Protótipo experimental. Não usar para navegação real.</p><h3>Cartas raster disponíveis</h3><p>Seleção verificada no catálogo da Marinha em 17/10/2026. Toque em uma carta para abrir seu ZIP no navegador externo. Catálogo parcial; não usar para navegação real.</p><input id="search" placeholder="Filtrar por número ou localidade" oninput="renderCharts()"><div id="results"></div><button onclick="Native.openCatalog('','')">Abrir catálogo nacional completo no navegador</button><script>const charts=[["1711","Proximidades do Porto de Santos","1711_2.zip","1,43 MB","14/09/2026"],["1712","Porto de Santos (Parte Norte)","1712_3.zip","1,07 MB","23/09/2026"],["1713","Porto de Santos (Parte Sul)","1713_2.zip","795,77 KB","12/05/2026"],["1640","Proximidades do Porto de São Sebastião","1640_2.zip","843,68 KB","14/09/2026"],["1643","Canal de São Sebastião (Parte Norte)","1643.zip","886,41 KB","23/09/2025"],["1644","Canal de São Sebastião (Parte Sul)","1644.zip","909,37 KB","23/09/2025"],["1703","Porto de Cananéia","1703.zip","501,51 KB","01/11/2018"],["1820","Proximidades da Barra de Paranaguá","1820_2.zip","1,02 MB","05/02/2026"],["1821","Barra de Paranaguá","1821_4.zip","827,3 KB","23/09/2026"],["1822","Portos de Paranaguá e Antonina","1822_7.zip","1007,87 KB","23/09/2026"],["1501","Baía de Guanabara","1501_2.zip","2 MB","10/07/2026"],["1511","Barra do Rio de Janeiro","1511_3.zip","2,1 MB","26/06/2026"],["1512","Porto do Rio de Janeiro","1512_4.zip","2,14 MB","14/09/2026"]];function renderCharts(){let q=document.getElementById('search').value.toLocaleLowerCase('pt-BR');let list=document.getElementById('results');list.replaceChildren();for(let c of charts.filter(c=>(c[0]+' '+c[1]).toLocaleLowerCase('pt-BR').includes(q))){let row=document.createElement('div');row.className='item';let label=document.createElement('div');label.textContent=c[0]+' — '+c[1]+' · '+c[3]+' · '+c[4];let btn=document.createElement('button');btn.textContent='Abrir ZIP no navegador';btn.onclick=()=>Native.openChart(c[2]);row.append(label,btn);list.append(row)}}document.addEventListener('DOMContentLoaded',renderCharts);</script><h3>Open-Meteo Marine</h3><input id="lat" type="number" value="-23.96" step=".01"><input id="lon" type="number" value="-46.30" step=".01"><button onclick="Native.marine(+lat.value,+lon.value)">Consultar</button><pre id="marine"></pre><h3>AISStream</h3><input id="key" type="password" placeholder="API Key"><button onclick="Native.saveKey(key.value)">Salvar chave</button><button onclick="connect()">Conectar</button><button onclick="disconnect()">Desconectar</button><pre id="ais"></pre><p id="status"></p><script>let socket=null;const $=id=>document.getElementById(id);function onStatus(s){$('status').textContent=s}function onMarine(s){try{$('marine').textContent=JSON.stringify(JSON.parse(s).current,null,2)}catch(e){$('marine').textContent=s}}function connect(){disconnect();let k=$('key').value||Native.getKey();if(!k){onStatus('Informe API Key');return}socket=new WebSocket('wss://stream.aisstream.io/v0/stream');socket.onopen=()=>{socket.send(JSON.stringify({APIKey:k,BoundingBoxes:[[[-34,-54],[-1,-30]]],FilterMessageTypes:['PositionReport','StandardClassBPositionReport']}));onStatus('AIS conectado')};socket.onmessage=e=>{$('ais').textContent=e.data.slice(0,2000)};socket.onerror=()=>onStatus('Erro AIS');socket.onclose=()=>onStatus('AIS desconectado')}function disconnect(){if(socket){socket.close();socket=null}}$('key').value=Native.getKey();</script></html>
