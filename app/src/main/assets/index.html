<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101c2a;color:#eee;font:16px sans-serif;padding:12px}button,input{background:#284257;color:white;border:1px solid #64819a;border-radius:7px;padding:12px;margin:4px}input{width:85%}#results{max-height:38vh;overflow:auto}.item{padding:8px;border-bottom:1px solid #456}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>NautiBR 0.1</h2><p>Protótipo experimental. Não usar para navegação real.</p><h3>Cartas da Marinha</h3><button onclick="Native.catalog()">Sincronizar catálogo nacional</button><input id="search" placeholder="Pesquisar carta" oninput="render()"><div id="results"></div><h3>Open-Meteo Marine</h3><input id="lat" type="number" value="-23.96" step=".01"><input id="lon" type="number" value="-46.30" step=".01"><button onclick="Native.marine(+lat.value,+lon.value)">Consultar</button><pre id="marine"></pre><h3>AISStream</h3><input id="key" type="password" placeholder="API Key"><button onclick="Native.saveKey(key.value)">Salvar chave</button><button onclick="connect()">Conectar</button><button onclick="disconnect()">Desconectar</button><pre id="ais"></pre><p id="status"></p><script>let items=[],socket=null;const $=id=>document.getElementById(id);function onStatus(s){$('status').textContent=s}function onCatalog(s){try{items=JSON.parse(s);render();onStatus(items.length+' cartas encontradas')}catch(e){onStatus(e.message)}}function render(){let q=$('search').value.toLowerCase();$('results').replaceChildren();for(let x of items.filter(x=>x.name.toLowerCase().includes(q)).slice(0,100)){let d=document.createElement('div'),b=document.createElement('button');d.className='item';d.textContent=x.name;b.textContent='Baixar';b.onclick=()=>Native.download(x.url);d.append(b);$('results').append(d)}}function onMarine(s){try{$('marine').textContent=JSON.stringify(JSON.parse(s).current,null,2)}catch(e){$('marine').textContent=s}}function connect(){disconnect();let k=$('key').value||Native.getKey();if(!k){onStatus('Informe API Key');return}socket=new WebSocket('wss://stream.aisstream.io/v0/stream');socket.onopen=()=>{socket.send(JSON.stringify({APIKey:k,BoundingBoxes:[[[-34,-54],[-1,-30]]],FilterMessageTypes:['PositionReport','StandardClassBPositionReport']}));onStatus('AIS conectado')};socket.onmessage=e=>{$('ais').textContent=e.data.slice(0,2000)};socket.onerror=()=>onStatus('Erro AIS');socket.onclose=()=>onStatus('AIS desconectado')}function disconnect(){if(socket){socket.close();socket=null}}$('key').value=Native.getKey();</script></html>
